# CI on every pull request and push to main; deploy to Render after main passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Route types (LayoutProps, PageProps) live in .next/types, which a fresh checkout lacks.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy to Render
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-render
      cancel-in-progress: false
    environment:
      name: render
      url: https://kavach-demo.onrender.com
    steps:
      - name: Trigger the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy of ${GITHUB_SHA::7} requested."

  smoke:
    name: Smoke test the live deploy
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-render
      cancel-in-progress: false
    env:
      KAVACH_URL: https://kavach-demo.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Wait until Render serves this commit
        run: |
          for i in $(seq 1 60); do
            served=$(curl -fsS "$KAVACH_URL/api/health" 2>/dev/null | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')
            if [ "$served" = "$GITHUB_SHA" ]; then echo "Live at ${GITHUB_SHA::7}."; exit 0; fi
            echo "Serving ${served:-nothing yet}, waiting for ${GITHUB_SHA::7}..."
            sleep 15
          done
          echo "::error::Render did not serve ${GITHUB_SHA::7} within 15 minutes."
          exit 1
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run smoke:live
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-out
          path: smoke-out/
          if-no-files-found: ignore
